spring:
  profiles:
    # Sem SPRING_PROFILES_ACTIVE assume dev (ambiente local). Em produção,
    # defina outro profile — o fallback do JWT_SECRET derruba o boot lá.
    default: dev
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/dietas}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

security:
  jwt:
    secret: ${JWT_SECRET:changeme-this-is-a-very-long-secret-key-for-jwt-signing-min-256-bits}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}

llm:
  gemini:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    base-url: ${GEMINI_BASE_URL:https://generativelanguage.googleapis.com}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

server:
  port: 8080

logging:
  level:
    com.gerador.dietas: INFO
    org.flywaydb: INFO
